name: toi-lite

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:${TOI_KEYCLOAK_PORT:-8180}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: toi-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TOI_KEYCLOAK_ADMIN_PASSWORD:?Run scripts/dev-up.mjs to generate identity secrets}
      KC_HOSTNAME: http://localhost:${TOI_KEYCLOAK_PORT:-8180}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-toi.json:/opt/keycloak/data/import/realm-toi.json:ro

  # 이름 있는 볼륨은 root 소유로 만들어진다. verdaccio(uid 10001)가 htpasswd·storage를 쓸 수 있게 먼저 소유권을 맞춘다.
  verdaccio-init:
    image: verdaccio/verdaccio:6
    user: root
    entrypoint: ["sh", "-c", "chown -R 10001:65533 /verdaccio/storage /verdaccio/auth"]
    volumes:
      - verdaccio-storage:/verdaccio/storage
      - verdaccio-auth:/verdaccio/auth
    restart: "no"

  verdaccio:
    image: verdaccio/verdaccio:6
    depends_on:
      verdaccio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TOI_REGISTRY_PORT:-4973}:4873"
    volumes:
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - verdaccio-storage:/verdaccio/storage
      - verdaccio-auth:/verdaccio/auth

  minio:
    # Docker Hub의 minio/minio는 공개 pull이 막혀 있어 quay.io 이미지를 릴리스 태그로 고정한다.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${TOI_MINIO_PORT:-9400}:9000"
      - "127.0.0.1:${TOI_MINIO_CONSOLE_PORT:-9401}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-toi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-toi-local-secret}
    volumes:
      - minio-data:/data

volumes:
  verdaccio-storage:
  verdaccio-auth:
  minio-data:
  keycloak-data:
