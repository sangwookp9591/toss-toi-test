<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOI preview runtime</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172334;font:15px system-ui}header{padding:24px 32px;background:white;border-bottom:1px solid #dbe2eb}h1{margin:0;font-size:23px}header p{margin:8px 0 0;color:#536176}main{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}section{min-width:0}label,h2{display:block;font-size:15px;font-weight:600;margin:0 0 12px}textarea{width:100%;height:420px;resize:vertical;border:1px solid #bdcadd;border-radius:8px;padding:16px;background:#122033;color:#e5edf7;font:14px/1.6 monospace}button{margin:12px 8px 12px 0;padding:10px 16px;border:0;border-radius:6px;background:#2563eb;color:white;font:inherit;cursor:pointer}button+button{background:#e0e6ef;color:#172334}#preview{position:relative;height:480px;background:white;border:1px solid #bdcadd;border-radius:8px;overflow:hidden}pre{font:12px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere} @media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>TOI browser preview</h1><p>Only a successfully rendered, current revision replaces the last working screen.</p></header><main><section><label for="editor">App source · /src/main.tsx</label><textarea id="editor" spellcheck="false"></textarea><button id="build">Build revision</button><button id="cancel">Cancel latest attempt</button><pre id="status" role="status">Loading manifest…</pre></section><section><h2>Last successful preview</h2><div id="preview"></div></section></main><script type="module" src="/demo.js"></script></body></html>
